services:
  builder:
    image: sourcetvmanager-builder:local
    build:
      context: .
      dockerfile: Dockerfile.build
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: none
    environment:
      HOME: /tmp
    volumes:
      - .:/workspace:ro
      - ./.build:/output
      - ./dist:/dist
    command:
      - make
      - build-exts-linux
      - package-exts-linux
      - DEPS_DIR=/opt/sm-deps
      - BUILD_DIR=/output/linux-l4d2
      - VENV_DIR=/opt/sm-deps/.venv
      - DIST_DIR=/dist
